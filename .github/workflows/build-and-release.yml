name: Build and Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get tag version
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Compare config.xml version with tag
        id: compare_version
        run: |
          CONFIG_VERSION=$(grep -m1 '<version>' config.xml | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
          TAG_VERSION=${{ steps.get_version.outputs.version }}
          if [ "$CONFIG_VERSION" != "$TAG_VERSION" ]; then
            echo "version_mismatch=true" >> $GITHUB_OUTPUT
          else
            echo "version_mismatch=false" >> $GITHUB_OUTPUT
          fi
          echo "Config version: $CONFIG_VERSION"
          echo "Tag version: $TAG_VERSION"

      - name: Lint PHP syntax
        run: php -l config.xml

      - name: Create GitHub release
        if: steps.compare_version.outputs.version_mismatch == 'false'
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: actions/github-script@v6
        with:
          script: |
            const tag = '${{ github.ref_name }}';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const releaseExists = await github.rest.repos.getReleaseByTag({
              owner,
              repo,
              tag_name: tag
            });
            if (!releaseExists.data.url) {
              const release = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                name: `AuthOAuth2 ${tag}`,
                body: 'Release for LimeSurvey AuthOAuth2 plugin',
                draft: false,
                prerelease: false
              });
            }
          result-encoding: string

      - name: Run build.sh
        if: steps.compare_version.outputs.version_mismatch == 'false'
        run: |
          chmod +x build.sh
          ./build.sh --build ${{ steps.get_version.outputs.version }}

      - name: Upload release assets
        if: steps.compare_version.outputs.version_mismatch == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: builds-${{ steps.get_version.outputs.version }}/AuthOAuth2-${{ steps.get_version.outputs.version }}.zip
          asset_name: AuthOAuth2-${{ steps.get_version.outputs.version }}.zip
          asset_content_type: application/zip

      - name: Upload SHA256SUMS asset
        if: steps.compare_version.outputs.version_mismatch == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: builds-${{ steps.get_version.outputs.version }}/SHA256SUMS
          asset_name: SHA256SUMS
          asset_content_type: text/plain